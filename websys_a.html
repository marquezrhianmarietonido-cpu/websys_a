<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Calculator</title>

    <link rel="stylesheet" href="websys_a.css">
</head>

<body>

    <div class="calculator">

        <h1>NUMBER CALCULATOR</h1>

        <div class="languages">
            <span>HTML</span>
            <span>•</span>
            <span>CSS</span>
            <span>•</span>
            <span>JAVASCRIPT</span>
        </div>

        <p class="subtitle">
            Enter three numbers below
        </p>

        <div class="input-area">

            <div class="input-group">
                <label>01</label>
                <input type="number" id="num1" placeholder="First number">
            </div>

            <div class="input-group">
                <label>02</label>
                <input type="number" id="num2" placeholder="Second number">
            </div>

            <div class="input-group">
                <label>03</label>
                <input type="number" id="num3" placeholder="Third number">
            </div>

        </div>

        <button onclick="calculate()">
            CALCULATE ♡
        </button>

        <div class="result-box">

            <div class="result-title">
                <span>RESULTS</span>
                <span>✦</span>
            </div>

            <p id="result">
                Your results will appear here.
            </p>

        </div>

        <div class="footer">
            QUEZON CITY UNIVERSITY • WS101 • COLLEGE OF COMPUTER STUDIES
        </div>

     </div>

    <script src="websys_a.js"></script>

</body>
</html>
